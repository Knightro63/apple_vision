name: example
description: A new Flutter project.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=2.18.6 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera_macos: ^0.1.0
  camera: ^0.12.0+2
  apple_vision_animal_pose:
    path: ../../apple_vision_animal_pose
  cupertino_icons: ^1.0.2
  permission_handler: ^11.0.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

dependency_overrides:
  permission_handler_apple:
    git:
      url: https://github.com/riccardo-lomazzi/flutter-permission-handler.git
      path: permission_handler_apple/

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
